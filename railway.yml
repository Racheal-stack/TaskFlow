services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    variables:
      NODE_ENV: production
      PORT: 5001
    healthcheck:
      command: ["curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    variables:
      NODE_ENV: production
    depends_on:
      - backend