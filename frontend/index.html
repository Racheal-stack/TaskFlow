<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - Team Task & Workflow Manager</title>
    <meta name="description" content="TaskFlow helps teams manage tasks and workflows efficiently. Create workspaces, assign tasks, track progress, and collaborate in real-time." />
    
    <!-- Preload Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SEO Meta Tags -->
    <meta property="og:title" content="TaskFlow - Team Task & Workflow Manager" />
    <meta property="og:description" content="Streamline your team's productivity with TaskFlow. Manage tasks, projects, and workflows in one powerful platform." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://taskflow.app" />
    <meta property="og:image" content="/og-image.png" />
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TaskFlow - Team Task & Workflow Manager" />
    <meta name="twitter:description" content="Streamline your team's productivity with TaskFlow." />
    <meta name="twitter:image" content="/twitter-image.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#3B82F6" />
    
    <style>
      /* Loading spinner styles */
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3B82F6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Initial loading screen */
      #initial-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      .loading-logo {
        font-size: 2rem;
        font-weight: 700;
        color: #3B82F6;
        margin-bottom: 1rem;
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Initial loading screen -->
    <div id="initial-loading">
      <div class="loading-logo">TaskFlow</div>
      <div class="loading-spinner"></div>
      <p style="margin-top: 1rem; color: #6B7280; font-family: 'Inter', sans-serif;">Loading your workspace...</p>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <script>
      // Remove loading screen once React app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('initial-loading');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.3s ease-out';
            setTimeout(function() {
              loadingScreen.remove();
            }, 300);
          }
        }, 1000);
      });
    </script>
  </body>
</html>
